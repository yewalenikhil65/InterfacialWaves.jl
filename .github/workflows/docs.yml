name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages branch

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      # Cache the Julia package depot — critical given the heavy dependency tree
      # (OrdinaryDiffEq, SciMLSensitivity, FFTW, etc.).
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-depot-docs-${{ runner.os }}-${{ hashFiles('docs/Project.toml', 'docs/Manifest.toml') }}
          restore-keys: |
            julia-depot-docs-${{ runner.os }}-

      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
          '

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
